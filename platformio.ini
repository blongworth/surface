; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
build_flags = 
    -D USB_MTPDISK_SERIAL
    -D ENABLE_TELEMETRY=0
lib_ldf_mode = deep
lib_deps = 
    https://github.com/KurtE/MTP_Teensy.git
	latimes2/InternalTemperature@^2.1.1-a
    https://github.com/blongworth/flasher-library.git

[env:teensy41_telemetry]
extends = env:teensy41
build_flags = 
    -D USB_MTPDISK_SERIAL
    -D ENABLE_TELEMETRY=1
